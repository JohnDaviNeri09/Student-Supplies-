<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfficePro - Modern Workspace Supplies</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

  <div id="root"></div>

  <!-- Voiceflow AI Chatbot Script Integration -->
  <script type="text/javascript">
    (function(d, t) {
        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
        v.onload = function() {
          window.voiceflow.chat.load({
            verify: { projectID: 'YOUR_VOICEFLOW_PROJECT_ID' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production'
          });
        }
        v.src = "https://cdn.voiceflow.com/widget/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
    })(document, 'script');
  </script>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SUPABASE CLIENT CONFIGURATION ---
    // Replace these placeholder strings with your actual Supabase URL & Anon Key
    const SUPABASE_URL = 'https://nhovihqrrxxkmrhljgtv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ob3ZpaHFycnh4a21yaGxqZ3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTk3NjgsImV4cCI6MjEwMzIzNTc2OH0.CWbykdLY25BTSuQAFpHhInr07QcqjmhgEGwenT7ABB4';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function OfficeSupplyPlatform() {
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [gcash, setGcash] = useState('');

      // Products State
      const [products, setProducts] = useState([
        { id: '1', title: 'Ergonomic Mesh Executive Chair', price: 4999, image_url: 'https://images.unsplash.com/photo-1580481072645-022f9a6d83d0?w=500', rating: 5 },
        { id: '2', title: 'Minimalist Mechanical Keyboard', price: 2499, image_url: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500', rating: 4 },
        { id: '3', title: 'Sustainable Bamboo Desk Organizer', price: 799, image_url: 'https://images.unsplash.com/photo-1544816155-12df9643f363?w=500', rating: 5 }
      ]);

      const [newProduct, setNewProduct] = useState({ title: '', price: '', image_url: '', description: '' });

      // Authentication Handler
      const handleAuth = async (isSignUp) => {
        if (!email || !password) return alert('Please input your email and password.');
        if (isSignUp && !gcash) return alert('GCash number is required for registration.');

        if (isSignUp) {
          setUser({ email, gcash });
          alert(`Account registered successfully! GCash Number linked: ${gcash}`);
        } else {
          setUser({ email, gcash: '09171234567' });
          alert('Successfully logged in.');
        }
        setActiveTab('home');
      };

      // Checkout Handler via PayMongo API Route
      const handleCheckout = async (product) => {
        if (!user) return alert('Please sign in or register an account to make purchases!');
        try {
          const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount: product.price,
              description: product.title,
              buyerId: user.email,
              productId: product.id
            })
          });
          const data = await res.json();
          if (data.checkoutUrl) {
            window.location.href = data.checkoutUrl;
          } else {
            alert('Failed to obtain PayMongo checkout URL.');
          }
        } catch (err) {
          alert('Error initializing PayMongo Checkout.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          <!-- 1. HEADER & NAVIGATION LINKS -->
          <header className="sticky top-0 z-50 bg-slate-900 text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
              <div className="text-2xl font-black tracking-tight text-blue-500 flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                <span>OFFICE</span><span className="text-white">PRO</span>
              </div>
              <nav className="hidden md:flex space-x-8 text-sm font-semibold tracking-wide">
                <button onClick={() => setActiveTab('home')} className={`capitalize transition-colors ${activeTab === 'home' ? 'text-blue-500 border-b-2 border-blue-500 pb-1' : 'text-slate-300 hover:text-blue-400'}`}>Home</button>
                <button onClick={() => setActiveTab('store')} className={`capitalize transition-colors ${activeTab === 'store' ? 'text-blue-500 border-b-2 border-blue-500 pb-1' : 'text-slate-300 hover:text-blue-400'}`}>Store Page</button>
                <button onClick={() => setActiveTab('about')} className={`capitalize transition-colors ${activeTab === 'about' ? 'text-blue-500 border-b-2 border-blue-500 pb-1' : 'text-slate-300 hover:text-blue-400'}`}>About Us</button>
                <button onClick={() => setActiveTab('contacts')} className={`capitalize transition-colors ${activeTab === 'contacts' ? 'text-blue-500 border-b-2 border-blue-500 pb-1' : 'text-slate-300 hover:text-blue-400'}`}>Contacts</button>
                {user && (
                  <button onClick={() => setActiveTab('dashboard')} className={`capitalize transition-colors ${activeTab === 'dashboard' ? 'text-blue-500 border-b-2 border-blue-500 pb-1' : 'text-slate-300 hover:text-blue-400'}`}>Seller Dashboard</button>
                )}
              </nav>
              <div>
                {user ? (
                  <button onClick={() => setUser(null)} className="px-4 py-2 text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white rounded-md transition-all">
                    Logout
                  </button>
                ) : (
                  <button onClick={() => setActiveTab('auth')} className="px-5 py-2.5 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-all shadow-md">
                    Sign In / Register
                  </button>
                )}
              </div>
            </div>
          </header>

          <!-- BODY SECTIONS -->
          <main className="mb-auto">

            <!-- HOME PAGE: Rule of Thirds Layout & CTA -->
            {activeTab === 'home' && (
              <div>
                <section className="max-w-7xl mx-auto px-6 py-20 grid grid-cols-1 md:grid-cols-3 gap-12 items-center">
                  <div className="md:col-span-2 space-y-6">
                    <span className="text-blue-600 font-bold tracking-wider text-xs uppercase bg-blue-100 px-3 py-1 rounded-full">Ergonomic & Efficient Workspace Supplies</span>
                    <h1 className="text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
                      Elevate Your Daily Productivity Infrastructure.
                    </h1>
                    <p className="text-lg text-slate-600 max-w-xl leading-relaxed">
                      Premium commercial office supplies, ergonomic furniture, and high-performance tech accessories engineered for modern teams.
                    </p>
                    
                    <!-- 3. CALL TO ACTION (CTA) -->
                    <div className="pt-4 flex gap-4">
                      <button onClick={() => setActiveTab('store')} className="px-8 py-4 bg-blue-600 text-white font-bold rounded-lg shadow-xl hover:bg-blue-700 transition-all">
                        Explore Store Catalog
                      </button>
                      <button onClick={() => setActiveTab('auth')} className="px-8 py-4 bg-slate-200 text-slate-800 font-bold rounded-lg hover:bg-slate-300 transition-all">
                        Start Selling Now
                      </button>
                    </div>
                  </div>
                  <div className="md:col-span-1">
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=600" alt="Workspace Setup" className="rounded-2xl shadow-2xl object-cover h-96 w-full" />
                  </div>
                </section>

                <!-- FEATURES (White Space & High Contrast) -->
                <section className="bg-white py-20 border-t border-slate-200">
                  <div className="max-w-7xl mx-auto px-6">
                    <h2 className="text-3xl font-extrabold text-center text-slate-900 mb-16">Designed for Seamless Commerce</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                      <div className="p-8 bg-slate-50 rounded-xl border border-slate-100 space-y-4">
                        <div className="w-12 h-12 bg-blue-600 text-white flex items-center justify-center font-bold text-xl rounded-lg">₱</div>
                        <h3 className="text-xl font-bold text-slate-900">GCash & PayMongo Integrated</h3>
                        <p className="text-slate-600 text-sm leading-relaxed">Instant automated checkouts using local payment rails with secure webhook verification.</p>
                      </div>
                      <div className="p-8 bg-slate-50 rounded-xl border border-slate-100 space-y-4">
                        <div className="w-12 h-12 bg-blue-600 text-white flex items-center justify-center font-bold text-xl rounded-lg">🤖</div>
                        <h3 className="text-xl font-bold text-slate-900">Voiceflow AI Support</h3>
                        <p className="text-slate-600 text-sm leading-relaxed">Automated assistant resolving queries, tracking orders, and navigating products 24/7.</p>
                      </div>
                      <div className="p-8 bg-slate-50 rounded-xl border border-slate-100 space-y-4">
                        <div className="w-12 h-12 bg-blue-600 text-white flex items-center justify-center font-bold text-xl rounded-lg">🏪</div>
                        <h3 className="text-xl font-bold text-slate-900">Multi-Vendor Marketplace</h3>
                        <p className="text-slate-600 text-sm leading-relaxed">Register as a seller, list products immediately, and track sales performance transparently.</p>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            )}

            <!-- STORE PAGE & REVIEWS / STAR RATINGS -->
            {activeTab === 'store' && (
              <section className="max-w-7xl mx-auto px-6 py-12">
                <h2 className="text-3xl font-extrabold mb-8 text-slate-900">Commercial Store Catalog</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {products.map((p) => (
                    <div key={p.id} className="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 flex flex-col justify-between">
                      <img src={p.image_url} alt={p.title} className="h-48 w-full object-cover" />
                      <div className="p-6 space-y-4">
                        <div className="flex justify-between items-start">
                          <h3 className="font-bold text-lg text-slate-900">{p.title}</h3>
                          <span className="text-yellow-500 font-bold">★ {p.rating}.0</span>
                        </div>
                        <p className="text-2xl font-black text-blue-600">₱{p.price.toLocaleString()}</p>
                        
                        <!-- Product Review / Star Rating Section -->
                        <div className="border-t pt-3 space-y-2">
                          <label className="text-xs font-bold text-slate-500">Rate & Review:</label>
                          <div className="flex text-yellow-400 cursor-pointer text-lg">
                            {'★'.repeat(p.rating)}{'☆'.repeat(5 - p.rating)}
                          </div>
                        </div>

                        <button onClick={() => handleCheckout(p)} className="w-full py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-blue-600 transition-colors">
                          Buy Now via PayMongo
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            <!-- USER REGISTRATION & GCASH INPUT -->
            {activeTab === 'auth' && (
              <section className="max-w-md mx-auto px-6 py-16">
                <div className="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 space-y-6">
                  <h2 className="text-2xl font-bold text-slate-900 text-center">Account Registration & Access</h2>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address</label>
                      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="name@company.com" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">GCash Number</label>
                      <input type="text" value={gcash} onChange={(e) => setGcash(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0917XXXXXXX" />
                    </div>
                    <div className="flex gap-4 pt-2">
                      <button onClick={() => handleAuth(false)} className="flex-1 py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800">Login</button>
                      <button onClick={() => handleAuth(true)} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">Register</button>
                    </div>
                  </div>
                </div>
              </section>
            )}

            <!-- SELLER DASHBOARD & HISTORY -->
            {activeTab === 'dashboard' && user && (
              <section className="max-w-7xl mx-auto px-6 py-12 space-y-12">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-4">Post Product for Sale</h2>
                  <div className="bg-white p-6 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" placeholder="Product Title" className="p-3 border rounded-lg" onChange={(e) => setNewProduct({...newProduct, title: e.target.value})} />
                    <input type="number" placeholder="Price (PHP)" className="p-3 border rounded-lg" onChange={(e) => setNewProduct({...newProduct, price: parseFloat(e.target.value) || 0})} />
                    <input type="text" placeholder="Image URL" className="p-3 border rounded-lg col-span-2" onChange={(e) => setNewProduct({...newProduct, image_url: e.target.value})} />
                    <button onClick={() => { setProducts([...products, { ...newProduct, id: Date.now().toString(), rating: 5 }]); alert('Product listed!'); }} className="col-span-2 py-3 bg-blue-600 text-white font-bold rounded-lg">Publish Listing</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <div className="bg-white p-6 rounded-xl border border-slate-200">
                    <h3 className="text-xl font-bold mb-4 text-slate-900">Seller Sales History</h3>
                    <div className="text-sm space-y-2 text-slate-600">
                      <div className="p-3 bg-slate-50 rounded border flex justify-between"><span>Ergonomic Mesh Executive Chair</span><span className="font-bold text-green-600">PAID - ₱4,999</span></div>
                    </div>
                  </div>
                  <div className="bg-white p-6 rounded-xl border border-slate-200">
                    <h3 className="text-xl font-bold mb-4 text-slate-900">Buyer Bought History</h3>
                    <div className="text-sm space-y-2 text-slate-600">
                      <div className="p-3 bg-slate-50 rounded border flex justify-between"><span>Minimalist Mechanical Keyboard</span><span className="font-bold text-blue-600">DELIVERED</span></div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            <!-- ABOUT US & CONTACTS -->
            {activeTab === 'about' && (
              <section className="max-w-4xl mx-auto px-6 py-16 text-slate-700 leading-relaxed">
                <h2 className="text-3xl font-extrabold text-slate-900 mb-4">About OfficePro</h2>
                <p>OfficePro delivers business supplies across the Philippines powered by secure GCash options and low-friction online ordering.</p>
              </section>
            )}
            {activeTab === 'contacts' && (
              <section className="max-w-4xl mx-auto px-6 py-16 text-slate-700 leading-relaxed">
                <h2 className="text-3xl font-extrabold text-slate-900 mb-4">Contact Us</h2>
                <p>For enterprise inquiries and support, contact support@officepro.ph</p>
              </section>
            )}
          </main>

          <!-- 4 & 5. SITEMAP & FOOTER -->
          <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 text-xs">
              <div>
                <h4 className="text-white font-bold mb-3 uppercase tracking-wider">Navigation</h4>
                <ul className="space-y-2">
                  <li><a href="#" onClick={() => setActiveTab('home')}>Home</a></li>
                  <li><a href="#" onClick={() => setActiveTab('store')}>Store Page</a></li>
                  <li><a href="#" onClick={() => setActiveTab('about')}>About Us</a></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-bold mb-3 uppercase tracking-wider">Account Operations</h4>
                <ul className="space-y-2">
                  <li><a href="#" onClick={() => setActiveTab('auth')}>Register GCash Account</a></li>
                  <li><a href="#" onClick={() => setActiveTab('dashboard')}>Seller Dashboard</a></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-bold mb-3 uppercase tracking-wider">Sitemap</h4>
                <ul className="space-y-2">
                  <li>/index.html (Home & Store)</li>
                  <li>/api/checkout (PayMongo Checkout API)</li>
                  <li>/api/webhooks/paymongo (PayMongo Event Listener)</li>
                </
